<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>译幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <main class="shell">
    <header class="topline remote-bar">
      <div class="brand">
        <img class="mark" src="icons/logo.svg" width="34" height="34" alt="">
        <div><h1>译幕</h1><p class="eyebrow">YouTube 中文配音</p></div>
      </div>
      <span class="tiny-key" id="buildBadge">版本…</span>
    </header>

    <section class="status-strip" aria-label="当前状态">
      <span class="status-chip"><span class="status-led" aria-hidden="true"></span><span id="status">已就绪</span></span>
      <span class="status-meter" id="tierMeta">整片准备</span>
    </section>

    <section class="context-card" id="tabContext" aria-label="当前视频">
      <span class="video-thumb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg></span>
      <span class="context-copy"><strong id="tabTitle">正在检查当前标签页…</strong><small id="tabMeta">在 YouTube 视频中使用译幕</small></span>
      <span class="attached" id="tabBadge">检查中</span>
    </section>

    <section class="intro-copy" aria-label="功能介绍">
      <span class="section-label">整片中文配音</span>
      <h2>听懂每一段。</h2>
      <p>有字幕先翻译；没有字幕，就识别完整音轨，再生成中文配音。</p>
    </section>

    <select id="tier" class="visually-hidden" aria-label="工作模式"><option value="caption">整片中文配音</option></select>
    <section class="setup-stack" id="setupStack" aria-label="MiniMax 服务">
      <div class="slot-card"><strong>正在加载服务…</strong><small>MiniMax 用于识别、翻译和中文配音。</small></div>
    </section>

    <details class="advanced preferences" id="preferences">
      <summary><span>声音与读取设置</span><span class="summary-hint">按需调整</span></summary>
      <div class="advanced-body">
        <label class="field"><span>中文音色</span><select id="voice"></select></label>
        <label class="field" id="customVoiceField" hidden><span>自定义 MiniMax 音色 ID</span><input id="customVoiceId" type="text" maxlength="80" autocomplete="off" placeholder="粘贴官方音色 ID"></label>
        <p>更多音色可查看 <a href="https://platform.minimax.cn/docs/faq/system-voice-id" target="_blank" rel="noopener noreferrer">MiniMax 官方音色列表</a>；填写音色 ID 后，新任务会使用该声音。</p>
        <label class="toggle-row"><span>使用 Chrome 登录状态读取音轨<small>仅在 YouTube 要求验证时开启</small></span><input id="useChromeCookies" type="checkbox"></label>
      </div>
    </details>

    <details class="advanced key-vault-all" id="keyVaultAll" hidden>
      <summary><span>管理其他 API 密钥</span><span id="keyVaultBadge" class="badge">已保存 0 个</span></summary>
      <div class="advanced-body" id="keyVaultAllBody"><p>加载完成后，这里会显示已保存的密钥和服务帮助链接。</p></div>
    </details>

    <div hidden>
      <select id="lang" aria-label="配音语言"></select>
      <input id="originalVolume" type="range" min="0" max="100" value="18"><output id="originalOut">18</output>
      <input id="voiceVolume" type="range" min="0" max="100" value="100"><output id="voiceOut">100</output>
      <input id="showSource" type="checkbox">
      <button id="exportCaptionBundle" type="button">导出字幕包</button>
      <input id="importCaptionBundle" type="file" accept="application/json,.json">
      <button id="clearCaptionCache" type="button">清除缓存</button>
      <p id="captionBundleStatus" role="status">字幕包可恢复翻译结果和进度。</p>
    </div>

    <div class="action-dock"><button class="action" id="toggle" type="button">开始准备整片</button></div>
  </main>

  <script src="services/providers.js"></script>
  <script src="services/tier-recommendation.js"></script>
  <script src="services/srt-export.js"></script>
  <script src="services/translation-bundle.js"></script>
  <script src="lib/browser-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
